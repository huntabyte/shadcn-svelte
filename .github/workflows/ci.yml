name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: Type Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm ci

      - name: Run svelte-check
        run: pnpm check

      - name: Run toast adapter tests
        run: pnpm -F docs test:toast

  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm ci

      - run: pnpm lint

  cli-test:
    name: CLI-Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm ci

      - name: Build packages
        run: pnpm build:cli

      - name: Run tests
        run: pnpm -F shadcn-svelte test

  parity-test:
    name: Parity-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm ci

      - name: Run tests
        run: pnpm -F @shadcn-svelte/parity test

  primitives-test:
    name: Primitives-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm ci

      - name: Install Playwright browsers
        run: pnpm -F @shadcn-svelte/primitives exec playwright install chromium --with-deps

      - name: Run unit tests
        run: pnpm -F @shadcn-svelte/primitives test

      - name: Run browser tests
        run: pnpm -F @shadcn-svelte/primitives test:browser
