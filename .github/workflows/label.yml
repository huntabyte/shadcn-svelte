name: Label

on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, edited, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]

concurrency:
  group: label-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    if: github.event.comment.user.login != 'github-actions[bot]' && (github.event.issue.state || github.event.pull_request.state) == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skip issues and PRs older than 1 year
        id: age
        env:
          CREATED_AT: ${{ github.event.issue.created_at || github.event.pull_request.created_at }}
        run: |
          cutoff=$(date -u -d '1 year ago' +%s)
          created=$(date -u -d "$CREATED_AT" +%s)
          if [ "$created" -lt "$cutoff" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Skipping: created more than 1 year ago ($CREATED_AT)"
          fi

      - uses: actions/checkout@v4
        if: steps.age.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.age.outputs.skip != 'true'
        with:
          node-version: 24

      - name: Record labels
        if: steps.age.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: gh api "repos/${GITHUB_REPOSITORY}/issues/${NUMBER}/labels" --jq '.[].name' > labels-before.txt

      - name: Label
        if: steps.age.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: npx --yes @ieedan/label label -R "$GITHUB_REPOSITORY" --config .github/.label.yml "${{ github.event.issue.number || github.event.pull_request.number }}"

      # Label events created with GITHUB_TOKEN do not start other workflows.
      - name: Dispatch anti-slop
        if: steps.age.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          KIND: ${{ (github.event_name == 'pull_request_target' || github.event.issue.pull_request) && 'PR' || 'issue' }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${NUMBER}/labels" --jq '.[].name' > labels-after.txt
          if grep -qx 'slop' labels-after.txt && ! grep -qx 'slop' labels-before.txt; then
            gh workflow run anti-slop.yml -f number="$NUMBER" -f kind="$KIND"
          fi

      - name: Dispatch reproduire
        if: steps.age.outputs.skip != 'true' && !github.event.pull_request && !github.event.issue.pull_request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          if grep -qx 'needs reproduction' labels-after.txt && ! grep -qx 'needs reproduction' labels-before.txt; then
            gh workflow run reproduire.yml -f number="$NUMBER"
          fi
