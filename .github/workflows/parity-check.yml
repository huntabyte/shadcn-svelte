name: Parity Check

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  base:
    name: Parity Check (base)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Check base class parity
        run: pnpm -F docs parity-check

  variants:
    name: Parity Check (variants)
    runs-on: ubuntu-latest
    # The generated registries are compared against the registry deployed at
    # ui.shadcn.com, while our base sources and style CSS follow upstream `main`.
    # When the deployed registry lags `main`, diffs here can be short-lived
    # upstream skew. This job reports but does not block a PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Check generated registry parity
        run: pnpm -F docs parity-check:variants

  docs-ui:
    name: Parity Check (docs UI)
    runs-on: ubuntu-latest
    steps:
      - name: Check for docs UI parity changes
        id: changes
        uses: actions/github-script@v8
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            })
            const inputs = new Set([
              ".github/workflows/parity-check.yml",
              "docs/content/components/attachment.md",
              "docs/package.json",
              "docs/src/lib/components/component-preview-tabs.svelte",
              "docs/src/lib/components/docs-sidebar.svelte",
              "docs/src/routes/(app)/(layout)/(root)/+page.svelte",
              "packages/parity/package.json",
              "packages/parity/src/commands/docs.ts",
              "packages/parity/src/commands/index.ts",
              "packages/parity/src/compare.ts",
              "packages/parity/src/docs.ts",
              "packages/parity/src/index.ts",
              "packages/parity/src/utils/errors.ts",
              "packages/parity/test/docs.test.ts",
              "pnpm-lock.yaml",
            ])
            return files.some(({ filename }) => inputs.has(filename))

      - if: steps.changes.outputs.result == 'true'
        uses: actions/checkout@v6
      - if: steps.changes.outputs.result == 'true'
        uses: pnpm/action-setup@v5
      - if: steps.changes.outputs.result == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - if: steps.changes.outputs.result == 'true'
        name: Install dependencies
        run: pnpm install

      - if: steps.changes.outputs.result == 'true'
        name: Check docs UI parity
        run: pnpm -F docs parity-check:docs
