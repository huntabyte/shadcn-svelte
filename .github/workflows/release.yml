name: Publish

on:
  push:
    branches:
      - main
      - next

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    permissions:
      contents: write # to create release (changesets/action)
      pull-requests: write # to create pull request (changesets/action)
      id-token: write # Required for OIDC
    name: Build & Publish Release
    if: github.repository == 'huntabyte/shadcn-svelte'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # npm 12 ships `sigstore` nested under workspaces/libnpmpublish, where
      # provenance.js can't resolve it. https://github.com/npm/cli/issues/9722
      - run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          commit-message: "chore(release): version package"
          pr-title: "chore(release): version package"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: pnpm ci:release
        env:
          NPM_CONFIG_PROVENANCE: true
          NODE_ENV: production
