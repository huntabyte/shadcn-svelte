name: Upload Preview Deployment

on:
  workflow_run:
    workflows: [Build Preview Deployment]
    types:
      - completed

permissions:
  actions: read
  deployments: write
  contents: read
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: macos-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        id: preview-build-artifact
        with:
          name: preview-build
          path: build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          # Do not pass gitHubToken here: workflow_run refs point to main, not the preview branch.
          wranglerVersion: "4"
          command: >-
            pages deploy
            ${{ steps.preview-build-artifact.outputs.download-path }}/cloudflare
            --project-name=shadcn-svelte
            --branch="${{ github.event.workflow_run.head_branch }}"
            --commit-hash="${{ github.event.workflow_run.head_sha }}"
