name: Anti-slop

on:
  issues:
    types: [labeled]
  pull_request_target:
    types: [labeled]
  # Label applies slop with GITHUB_TOKEN, which does not emit a labeled event.
  workflow_dispatch:
    inputs:
      number:
        description: Issue or pull request number
        required: true
        type: string
      kind:
        description: issue or PR
        required: true
        type: string

permissions:
  issues: write
  pull-requests: write

jobs:
  comment:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'slop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const dispatched = context.eventName === 'workflow_dispatch';
            const kind = dispatched
              ? context.payload.inputs.kind
              : context.payload.pull_request
                ? 'PR'
                : 'issue';
            const issue_number = dispatched
              ? Number(context.payload.inputs.number)
              : context.issue.number;
            const body = `Thank you for your contribution, the description of your ${kind} has been flagged as being generated by AI. This is something we disallow as part of our rules to contributing to shadcn-svelte [Responsible use of AI](https://github.com/huntabyte/shadcn-svelte/blob/main/CONTRIBUTING.md#responsible-use-of-ai). We are still willing to review your contribution but AI descriptions are forbidden because they are unnecessarily hard to parse and waste our maintainers valuable time. Please update your description with a human-written description and we will be happy to take a look!`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body,
            });
